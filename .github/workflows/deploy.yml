name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pwa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pwa/package-lock.json

      - run: npm ci

      # Build under the repo subpath so asset URLs resolve on Pages.
      # Portal endpoints are baked from repo secrets (kept out of source). Note: a frontend
      # bundle is public, so the baked URLs are visible in the shipped JS — never bake credentials.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_PORTAL_API: ${{ secrets.PORTAL_API }}
          VITE_UDM_API: ${{ secrets.UDM_API }}
          VITE_CENTRAL_API_KEY: ${{ secrets.CENTRAL_API_KEY }}

      # SPA deep-link fallback: Pages serves 404.html for unknown paths -> boot the app.
      - run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
